<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- 検索避け -->
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>キャラクター | 砂都夜行記</title>
  
  <!-- バージョン 1.0 に指定 -->
  <link rel="stylesheet" href="./style.css?v=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 固定ヘッダー -->
  <header class="site-header">
    <a href="./index.html" class="header-logo">砂都夜行記</a>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- ドロップダウンメニュー -->
  <nav class="dropdown-menu" id="dropdownMenu">
    <a href="./index.html">INDEX</a>
    <a href="./character.html">CHARACTER</a>
    <a href="./story.html">STORY</a>
    <a href="./author.html">AUTHOR</a>
  </nav>

  <!-- メインコンテンツ -->
  <main class="main-wrapper">
    <div class="content-card">
      <h1 class="page-title char-title-left">CHARACTER</h1>

      <!-- キャラクター選択用アイコン -->
      <div class="char-selector-container">
        <button class="char-thumb-btn active" data-char="1" aria-label="Nor'a Fainne">
          <img src="./nora-icon.png" alt="Nor'a Fainne Icon" onerror="this.src='./nora_bust.png'">
        </button>
        <button class="char-thumb-btn" data-char="2" aria-label="Hyde Gilham">
          <img src="./hyde-icon.png" alt="Hyde Gilham Icon" onerror="this.src='./nora_bust.png'">
        </button>
      </div>

      <!-- メイン画像表示エリア -->
      <div class="character-img-box" id="charImgBox">
        <!-- 画像背面のグラデーションレイヤー -->
        <div class="char-bg-overlay"></div>

        <!-- 矢印ナビボタン -->
        <button class="swipe-arrow arrow-left" id="prevBtn" aria-label="Back to Bust-up">▲</button>
        <button class="swipe-arrow arrow-right" id="nextBtn" aria-label="To Stand">▲</button>

        <!-- メイン画像 -->
        <img id="mainCharImg" src="./nora_bust.png" alt="Nor'a Fainne">
        
        <!-- 画像種別表示 -->
        <span class="img-type-badge" id="imgTypeBadge">BUST-UP</span>
      </div>

      <!-- プロフィールテキストエリア -->
      <div class="char-info align-left" id="charInfoBox">
        <span class="char-tag" id="charTag">Miqo'te / Moonkeeper</span>
        <h2 class="char-name-jp" id="charNameJp">Nor'a Fainne</h2>
        <p class="char-name-en" id="charNameEn">ノル・ア・ファインネ</p>
        <p class="char-bio" id="charBio">
          1人目のキャラクターのプロフィール文です。上のアイコンでキャラ変更、右矢印で立ち絵画像、左矢印でバストアップ画像に切り替わります。
        </p>
      </div>

    </div>
  </main>

  <!-- 固定フッター -->
  <footer class="site-footer">
    <p>maruhara / 転載禁止 Do not repost without permission.</p>
  </footer>

  <!-- スクリプト制御 -->
  <script>
    // ハンバーガーメニュー
    const menuBtn = document.getElementById('menuBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    menuBtn.addEventListener('click', () => {
      dropdownMenu.classList.toggle('active');
    });

// キャラクター＆画像データ
    const characters = {
      1: {
        tag: "Miqo'te / Moonkeeper & Sunseeker",
        nameJp: "Nor'a Fainne",
        nameEn: "ノル・ア・ファインネ（愛称：ノラ）",
        bio: `性別：男 / メインジョブ：黒魔導士
名付けの由来：光の輪（愛語）

【容姿】
青みがかったピンク髪・ピンク目、ムーンキーパーの瞳孔。牙あり。肌はサンシーカーに近い明るめの色。長毛の尾。身長はミコッテ族の中で高め。

【概要・経歴】
ウルダハの生まれではないが、幼い頃からウルダハで暮らすことを目標にしており、夢を叶えて魔法専門店「Lapa Chait Shí / ラパ ケットシー（ケットシーの手）」をウルダハの片隅に構えて生活している。
魔法道具や仕掛け、罠・呪い等々、人が魔法を工夫して施した機構を研究すること、また自身も応用し人の役に立つものを作ることが好き。そのためダンジョンや廃墟などに潜ることもしばしば。ただし高度に戦闘慣れしているわけではなく、自身の身を守れるくらいの力量。自作の防犯グッズをたくさん持ち歩いている。
魔法道具や術式に必要な錬金素材の販売、呪いの鑑定や解呪、家屋に対しての魔法的防諜・防犯施工等を売り物にしている。知名度も膨大な稼ぎもまだないが、丁寧に応対するのでそこそこ信頼されてきている模様。（ウルダハの呪術師でコミュニケーションに難がないことが売り）

【店舗・生活】
夜行性なので店は基本的に午後からしか開いていない（14時〜2時くらい）。また自身の他に従業員がいないため、施工作業などの外出中は開いていない。
店を開くために読み書き、ウルダハの法制度、経営・経理・契約、サプライヤー開拓等々、自力で勉強しており相当な努力家。またウルダハで商人として成功している従兄弟の兄に、開店資金の融資や不動産の手配を手伝ってもらった。人たらしの才能も従兄弟には劣るが少し持ち合わせている様子。
好きな食べ物はクイックサンドのクランペット。基本的には自炊節約。

【人間関係】
・カ・アン・ティア：従兄弟で非常に親しく思っている。お互い母から譲られた色違いのネックレスを身に付けている。今もよく連絡を取り合い、たまにウルダハで会ったりしている。明るい母は好きだが、父は口数少なくあまり仲良くはない。本当は母や従兄弟のような金髪が良かったと思っていたが、自分の髪色を従兄弟に褒められてから吹っ切れた。
・ハイド・ギラム：夜行性仲間。活動時間が合い、程よい付き合いを気に入られたのか、度々店を訪ねてきては飲みに誘われる（営業中）。ダンジョンに一緒に潜ったり、彼は護衛、自身は呪い避けとして組んで仕事をすることもある。戦闘能力は買っているが、自由な言動の彼に苛立ち振り回されることもしばしば。ただまあ貴重な友人であるとは思っている。

【台詞】
「いらっしゃい、入用は？それか何か困ってること、ある？」
「従兄弟が近々来るって！会わせてもいいけど…惚れるなよ。」
「あんたもう少し…肩の力を抜いてもいいと思うよ。」`,
        standImg: "./nora_stand.png",
        bustImg: "./nora_bust.png"
      },
      2: {
        tag: "Elezen / Shader",
        nameJp: "Hyde Gilham",
        nameEn: "ハイド・ギラム（ウルダハで適当に拾った名前）",
        bio: `性別：男 / メインジョブ：侍、モンク、ナイト
名前の由来：水銀（hydrargyrum）

【容姿】
色素の薄い暗い肌色に銀の髪、金に光る瞳。エレゼン族の中でも背が高い。耳は短い。顔に3つ傷跡がある（グリダニアと、集落と、ウルダハの路地裏で付けられた傷）。

【概要・経歴】
黒衣森の生まれだが精霊に拒まれグリダニアには入れず、子どもの頃に双蛇党含む人々と諍いを起こしたことから、グリダニアとの融和派（波風を立たず機嫌を損ねず息を潜める）であったシェーダーの集落から追いやられた。1人命からがらウルダハに辿り着き、金さえ掴めばどうにかなる国で生き延びた。
あまり感情を表には出さずいつも物憂げな顔つきをしている。ただ好奇心が死んだわけではなく、興味を持てば自分からアプローチしたり、表情はさほど変わらずとも楽しみもする。勘違いされやすい。逆境を超えたこともあり肝が据わっている。
自分の自由を束縛される、意思を蔑ろにされることが殊更嫌いで、罵倒や悪態には慣れているが彼の行動の邪魔をするとすぐに手が出て暴力で解決しがち。基本的に困っている人は助けず自分で何とかするべきだという考えだが、稀に親しみを感じた友人には手や耳を貸すこともあるらしい。

【生業・生活】
体格を活かした武闘に優れ、護衛や討伐などの荒事で稼いでいる。度々代打として穴埋めで剣闘や拳闘の試合に出る時もあり、それが観たくて欠場をチェックするファンもいるらしい。ウルダハでは珍しい種族を活かして服飾のモデルをすることもある。
豪商の側仕えの仕事をしていた時に気に入られ、読み書きや計算、社交の作法等を教わり必死に覚えたため教養は身についている。
部屋に調度品は少なく飾り気はないが、人から受け取った服飾品がたくさん収納されている。着飾ることが似合い人に好印象を抱かせることを学習したため装いには気を遣っているが、自身の好みは特に無い。
御禁制の夢想花を加工したものを好み、ウルダハの数ある店舗で比較的中毒性の低いものを選んで時々服用している。好きな食べ物は柘榴と豆類。自炊はしない、少食。

【人間関係】
・ノル・ア・ファインネ：夜行性仲間（夜起きて朝眠る。分厚い遮光カーテンで部屋を暗くし布団にくるまって眠る。寝起きは悪い）。馴染みの店が潰れ新しく開店したノラの店を偶然訪れてから、ウルダハには珍しいお人好しを気に入り（面白がり）度々飲みに誘っている。

【台詞】
「飲みに行こう。こんな時間に誰も来ないだろう。」
「エディブルは控えた方がいい。効き目が強い。」
「…私は君ほど聡くはないよ」`,
        standImg: "./hyde_stand.png",
        bustImg: "./hyde_bust.png"
      }
    };

    // 画像プリロード処理
    const preloadedImages = [];
    function preloadAllImages() {
      Object.values(characters).forEach(c => {
        const imgStand = new Image();
        imgStand.src = c.standImg;
        preloadedImages.push(imgStand);

        const imgBust = new Image();
        imgBust.src = c.bustImg;
        preloadedImages.push(imgBust);
      });
    }

    let currentCharId = 1;
    let currentViewType = 'bust';

    // DOM要素
    const mainCharImg = document.getElementById('mainCharImg');
    const charTag = document.getElementById('charTag');
    const charNameJp = document.getElementById('charNameJp');
    const charNameEn = document.getElementById('charNameEn');
    const charBio = document.getElementById('charBio');
    const imgTypeBadge = document.getElementById('imgTypeBadge');
    
    const charImgBox = document.getElementById('charImgBox');
    const charInfoBox = document.getElementById('charInfoBox');
    const thumbBtns = document.querySelectorAll('.char-thumb-btn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // 表示更新関数
    function updateDisplay(charId, viewType) {
      const data = characters[charId];
      if (!data) return;

      currentCharId = parseInt(charId);
      currentViewType = viewType;

      thumbBtns.forEach(btn => {
        if (parseInt(btn.getAttribute('data-char')) === currentCharId) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      charImgBox.classList.add('fade-out');
      charInfoBox.classList.add('fade-out');

      setTimeout(() => {
        const targetImg = (viewType === 'stand') ? data.standImg : data.bustImg;
        mainCharImg.src = targetImg;
        mainCharImg.onerror = () => { mainCharImg.src = './nora_bust.png'; };

        charTag.textContent = data.tag;
        charNameJp.textContent = data.nameJp;
        charNameEn.textContent = data.nameEn;
        charBio.textContent = data.bio;
        imgTypeBadge.textContent = (viewType === 'stand') ? 'STAND' : 'BUST-UP';

        if (viewType === 'bust') {
          prevBtn.style.display = 'none';
          nextBtn.style.display = 'flex';
        } else {
          prevBtn.style.display = 'flex';
          nextBtn.style.display = 'none';
        }

        charImgBox.classList.remove('fade-out');
        charInfoBox.classList.remove('fade-out');
      }, 80);
    }

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      preloadAllImages();
      updateDisplay(1, 'bust');
    });

    // アイコンタップ時
    thumbBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-char');
        updateDisplay(id, 'bust');
      });
    });

    // 矢印ボタンタップ時
    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      updateDisplay(currentCharId, 'stand');
    });

    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      updateDisplay(currentCharId, 'bust');
    });

    // スワイプ処理
    let startX = 0;
    let endX = 0;

    charImgBox.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
    }, { passive: true });

    charImgBox.addEventListener('touchend', (e) => {
      endX = e.changedTouches[0].clientX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diffX = startX - endX;
      if (Math.abs(diffX) > 40) {
        if (diffX > 0 && currentViewType === 'bust') {
          updateDisplay(currentCharId, 'stand');
        } else if (diffX < 0 && currentViewType === 'stand') {
          updateDisplay(currentCharId, 'bust');
        }
      }
    }
  </script>
</body>
</html>
