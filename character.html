<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホ表示のレスポンシブ対応に必須のタグ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オリジナルギャラリー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- メインビジュアルエリア -->
  <div class="card-container">
    <!-- スマホ全画面に収まる画像枠 -->
    <div class="image-wrapper">
      <!-- ★差し替えたい画像のパスを指定 -->
      <img src="main-image.jpg" alt="メイン画像" class="card-image">
    </div>

    <!-- 画像の下に重ねるコンテンツ（テキストやボタンなど） -->
    <div class="content">
      <h1 class="team-title">タイトル / 名前</h1>
      <p class="description">
        ここに説明文が入ります。テキストの分量に合わせて高さは自動で調整されます。
      </p>
      
      <!-- ボタンが必要な場合 -->
      <a href="#" class="btn">詳細を見る</a>
    </div>
  </div>

</body>
</html>
