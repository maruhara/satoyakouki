<!DOCTYPE html>
<html lang="ja">
<head>

  <!-- キャッシュ無効化タグ -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>CHARACTER | satoyakouki</title>
  
  <!-- バージョンパラメータ付きCSS読み込み -->
  <link rel="stylesheet" href="./style.css?v=1.2">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 固定ヘッダー -->

      <span></span>
      <span></span>

    </button>
  </header>

  <!-- ドロップダウンメニュー -->

    <a href="./story.html">STORY</a>
    <a href="./author.html">AUTHOR</a>

  <main class="main-wrapper">
    <div class="content-card">
      <h1 class="page-title">CHARACTER</h1>

      <div class="char-info">

        <h2 class="char-name-jp">キャラクター名</h2>

  <!-- 固定フッター -->

  </footer>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');

    menuBtn.addEventListener('click', () => {
      dropdownMenu.classList.toggle('active');
    });
  </script>
